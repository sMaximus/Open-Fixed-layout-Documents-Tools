<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OFD Viewer 组件示例</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: #f0f0f0;
        min-height: 100vh;
      }

      /* OFD 查看器容器 */
      #ofd-container {
        width: 100%;
        height: 100vh;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 20px;
        gap: 20px;
      }

      /* 文件选择按钮（可选，你可以用自己的方式触发加载） */
      .file-input-wrapper {
        position: fixed;
        top: 20px;
        right: 20px;
        z-index: 100;
      }

      .file-input-wrapper input {
        display: none;
      }

      .file-input-wrapper label {
        display: inline-block;
        padding: 10px 20px;
        background: #1890ff;
        color: white;
        border-radius: 4px;
        cursor: pointer;
      }

      .file-input-wrapper label:hover {
        background: #40a9ff;
      }

      /* 状态提示 */
      #status {
        position: fixed;
        top: 20px;
        left: 20px;
        padding: 8px 16px;
        background: rgba(0, 0, 0, 0.7);
        color: white;
        border-radius: 4px;
        font-size: 14px;
        z-index: 100;
      }
    </style>
  </head>
  <body>
    <!-- 状态显示 -->
    <div id="status">加载中...</div>

    <!-- 文件选择 -->
    <div class="file-input-wrapper">
      <input type="file" id="fileInput" accept=".ofd" />
      <label for="fileInput">选择 OFD 文件</label>
    </div>

    <!-- OFD 渲染容器 -->
    <div id="ofd-container"></div>

    <!-- 加载 WASM 运行时 -->
    <script src="wasm_exec.js"></script>
    <!-- 加载 OFD Viewer 组件 -->
    <script src="ofd-viewer.js"></script>

    <!-- <script src="../dist/ofd-viewer.min.js"></script> -->

    <script>
      const statusEl = document.getElementById("status");

      // 创建 OFD Viewer 实例
      const viewer = new OFDViewer("#ofd-container", {
        scale: 3.78,
        initialPages: 3,
        wasmPath: "ofd.wasm",

        onReady: () => {
          statusEl.textContent = "✅ 就绪，请选择文件";
        },

        onLoad: ({ pageCount }) => {
          statusEl.textContent = `✅ 已加载 ${pageCount} 页`;
        },

        onError: (err) => {
          statusEl.textContent = `❌ ${err.message}`;
        },

        onPageRender: (index) => {
          console.log(`页面 ${index + 1} 渲染完成`);
        },
      });

      // 初始化
      viewer.init().catch((err) => {
        statusEl.textContent = "❌ WASM 加载失败";
      });

      // 文件选择处理
      document
        .getElementById("fileInput")
        .addEventListener("change", async (e) => {
          const file = e.target.files[0];
          if (file) {
            statusEl.textContent = "⏳ 解析中...";
            try {
              await viewer.loadFile(file);
            } catch (err) {
              console.error(err);
            }
          }
        });

      // 支持拖放
      document.body.addEventListener("dragover", (e) => {
        e.preventDefault();
      });

      document.body.addEventListener("drop", async (e) => {
        e.preventDefault();
        const file = e.dataTransfer.files[0];
        if (file && file.name.toLowerCase().endsWith(".ofd")) {
          statusEl.textContent = "⏳ 解析中...";
          try {
            await viewer.loadFile(file);
          } catch (err) {
            console.error(err);
          }
        }
      });
    </script>
  </body>
</html>
""
