<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OFD React Demo</title>
    <link rel="stylesheet" href="index.css" />
    <style>
      #root {
        min-height: 100vh;
      }

      .react-viewer-frame {
        position: relative;
        flex: 1;
        min-width: 0;
        min-height: 0;
        background: #fff;
      }

      .react-viewer-host.viewer {
        width: 100%;
        height: 100%;
      }

      .react-empty-state {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        pointer-events: none;
      }

      .page-item {
        width: 100%;
        border: 0;
        text-align: left;
      }

      .page-item:disabled,
      .xml-btn:disabled,
      .upload-btn:disabled {
        cursor: not-allowed;
        opacity: 0.55;
      }

      .react-error {
        margin-top: 12px;
        padding: 8px 10px;
        border-radius: 4px;
        background: rgba(233, 69, 96, 0.12);
        color: #ff9aaa;
        font-size: 12px;
        line-height: 1.5;
        word-break: break-word;
      }

      .react-modal-file {
        width: 100%;
        border: 0;
        background: transparent;
        text-align: left;
      }

      .react-xml-empty {
        padding: 16px;
        color: #888;
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <script src="https://cdn.jsdelivr.net/npm/react@18/umd/react.production.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="./dist/ofd-viewer.umd.js"></script>
    <script type="module">
      import initWasm, { OFDParser } from "./pkg/ofd_rust.js";

      const h = React.createElement;
      const { useMemo, useRef, useState } = React;

      function stringifyValue(value) {
        if (value === null || value === undefined || value === "") return "-";
        if (typeof value === "object") return JSON.stringify(value);
        return String(value);
      }

      function getFileName(file) {
        if (typeof file === "string") return file;
        if (file && typeof file.name === "string") return file.name;
        if (file && typeof file.path === "string") return file.path;
        return String(file || "");
      }

      function InfoItem({ label, value }) {
        return h(
          "div",
          { className: "info-item" },
          h("span", { className: "info-label" }, label),
          h("span", { className: "info-value" }, stringifyValue(value)),
        );
      }

      function App() {
        const fileInputRef = useRef(null);
        const viewerHostRef = useRef(null);
        const viewerRef = useRef(null);
        const [ready, setReady] = useState(false);
        const [busy, setBusy] = useState(false);
        const [status, setStatus] = useState("加载 WASM...");
        const [error, setError] = useState("");
        const [fileName, setFileName] = useState("");
        const [pageCount, setPageCount] = useState(0);
        const [docInfo, setDocInfo] = useState(null);
        const [xmlFiles, setXmlFiles] = useState([]);
        const [xmlOpen, setXmlOpen] = useState(false);
        const [activeXmlFile, setActiveXmlFile] = useState("");
        const [xmlContent, setXmlContent] = useState("");

        React.useEffect(() => {
          let disposed = false;
          const container = viewerHostRef.current;
          if (!container) return undefined;

          const viewer = new OFDViewerLib.OFDViewer({
            container,
            onStatus: (message) => {
              if (!disposed) setStatus(message);
            },
            onDocInfo: (info) => {
              if (!disposed) setDocInfo(info);
            },
            onPageCount: (count) => {
              if (!disposed) setPageCount(count || 0);
            },
            onError: (err) => {
              if (!disposed) {
                setError(err && err.message ? err.message : String(err));
              }
            },
          });

          viewerRef.current = viewer;
          viewer
            .init(initWasm, OFDParser)
            .then(() => {
              if (!disposed) {
                setReady(true);
                setStatus("就绪");
              }
            })
            .catch((err) => {
              if (!disposed) {
                setError(err && err.message ? err.message : String(err));
                setStatus("WASM 加载失败");
              }
            });

          return () => {
            disposed = true;
            if (viewerRef.current) {
              viewerRef.current.destroy();
              viewerRef.current = null;
            }
          };
        }, []);

        const infoRows = useMemo(() => {
          const rows = [
            ["文件", fileName || "未选择"],
            ["页数", pageCount || "-"],
            ["状态", status],
          ];
          if (docInfo && typeof docInfo === "object") {
            Object.entries(docInfo)
              .filter(([, value]) => value !== null && value !== undefined && value !== "")
              .slice(0, 6)
              .forEach(([key, value]) => rows.push([key, value]));
          }
          return rows;
        }, [docInfo, fileName, pageCount, status]);

        async function onFileChange(event) {
          const file = event.target.files && event.target.files[0];
          if (!file || !viewerRef.current) return;

          setBusy(true);
          setError("");
          setFileName(file.name);
          setXmlOpen(false);
          setActiveXmlFile("");
          setXmlContent("");

          try {
            await viewerRef.current.loadFile(file);
            const files = viewerRef.current.getFiles();
            setXmlFiles(Array.isArray(files) ? files : []);
          } catch (err) {
            setError(err && err.message ? err.message : String(err));
          } finally {
            setBusy(false);
            event.target.value = "";
          }
        }

        function resetViewer() {
          if (viewerRef.current) viewerRef.current.destroy();
          setFileName("");
          setPageCount(0);
          setDocInfo(null);
          setXmlFiles([]);
          setXmlOpen(false);
          setActiveXmlFile("");
          setXmlContent("");
          setError("");
          setStatus(ready ? "就绪" : "加载 WASM...");
        }

        function openXmlModal() {
          const files = viewerRef.current ? viewerRef.current.getFiles() : [];
          const normalized = Array.isArray(files) ? files : [];
          setXmlFiles(normalized);
          setXmlOpen(true);
          if (normalized.length > 0) {
            selectXmlFile(getFileName(normalized[0]));
          }
        }

        function selectXmlFile(name) {
          const text = viewerRef.current ? viewerRef.current.readFileText(name) : "";
          setActiveXmlFile(name);
          setXmlContent(text || "");
        }

        const canLoad = ready && !busy;
        const hasDocument = pageCount > 0;

        return h(
          React.Fragment,
          null,
          h(
            "div",
            { className: "header" },
            h("h1", null, "OFD React 查看器"),
            h(
              "button",
              {
                className: "upload-btn",
                type: "button",
                disabled: !canLoad,
                onClick: () => fileInputRef.current && fileInputRef.current.click(),
              },
              busy ? "处理中..." : "选择 OFD 文件",
            ),
            h("input", {
              id: "fileInput",
              ref: fileInputRef,
              type: "file",
              accept: ".ofd",
              disabled: !canLoad,
              onChange: onFileChange,
            }),
            h(
              "button",
              {
                className: "xml-btn",
                type: "button",
                disabled: !hasDocument,
                onClick: openXmlModal,
              },
              "查看 XML",
            ),
            h(
              "button",
              {
                className: "xml-btn",
                type: "button",
                disabled: !fileName,
                onClick: resetViewer,
              },
              "清空",
            ),
            h("span", { className: "status" }, status),
          ),
          h(
            "div",
            { className: "main-container" },
            h(
              "aside",
              { className: "sidebar" },
              h("h3", null, "文档信息"),
              h(
                "div",
                { id: "docInfo" },
                infoRows.map(([label, value]) =>
                  h(InfoItem, { key: label, label, value }),
                ),
              ),
              error ? h("div", { className: "react-error" }, error) : null,
              h("h3", { style: { marginTop: 20 } }, "页面列表"),
              h(
                "div",
                { className: "page-list" },
                pageCount > 0
                  ? Array.from({ length: pageCount }, (_, index) =>
                      h(
                        "button",
                        {
                          key: index,
                          className: "page-item",
                          type: "button",
                          onClick: () =>
                            viewerRef.current && viewerRef.current.scrollToPage(index),
                        },
                        `第 ${index + 1} 页`,
                      ),
                    )
                  : h("div", { className: "info-item" }, "加载 OFD 后显示页面"),
              ),
            ),
            h(
              "main",
              { className: "react-viewer-frame" },
              h("div", {
                ref: viewerHostRef,
                className: "viewer react-viewer-host",
              }),
              !fileName
                ? h(
                    "div",
                    { className: "empty-state react-empty-state" },
                    h("p", { style: { fontSize: 42 } }, "OFD"),
                    h("p", null, "请选择 OFD 文件"),
                    h("p", { style: { fontSize: 12, color: "#555" } }, "React 负责界面状态，OFDViewer 负责渲染"),
                  )
                : null,
            ),
          ),
          xmlOpen
            ? h(
                "div",
                { className: "modal-overlay active" },
                h(
                  "div",
                  { className: "modal" },
                  h(
                    "div",
                    { className: "modal-header" },
                    h("h3", null, "OFD 压缩包内容"),
                    h(
                      "button",
                      {
                        className: "modal-close",
                        type: "button",
                        onClick: () => setXmlOpen(false),
                      },
                      "关闭",
                    ),
                  ),
                  h(
                    "div",
                    { className: "modal-body" },
                    h(
                      "div",
                      { className: "modal-sidebar" },
                      xmlFiles.length > 0
                        ? xmlFiles.map((file) => {
                            const name = getFileName(file);
                            return h(
                              "button",
                              {
                                key: name,
                                className:
                                  "tree-file react-modal-file" +
                                  (name === activeXmlFile ? " active" : ""),
                                type: "button",
                                onClick: () => selectXmlFile(name),
                              },
                              h("span", { className: "tree-file-name" }, name),
                            );
                          })
                        : h("div", { className: "react-xml-empty" }, "没有可查看的文件"),
                    ),
                    h(
                      "div",
                      { className: "modal-content" },
                      h(
                        "div",
                        { className: "modal-content-header" },
                        activeXmlFile || "请选择左侧文件",
                      ),
                      h("pre", { className: "xml-content" }, xmlContent),
                    ),
                  ),
                ),
              )
            : null,
        );
      }

      ReactDOM.createRoot(document.getElementById("root")).render(h(App));
    </script>
  </body>
</html>
