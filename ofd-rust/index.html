<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OFD 查看器</title>
    <link rel="stylesheet" href="index.css" />
  </head>
  <body>
    <div class="header">
      <h1>📄 OFD 查看器</h1>
      <button
        class="upload-btn"
        onclick="document.getElementById('fileInput').click()"
      >
        选择 OFD 文件
      </button>
      <input type="file" id="fileInput" accept=".ofd" />
      <button
        class="xml-btn"
        id="xmlBtn"
        style="display: none"
        onclick="window.showXmlModal()"
      >
        查看 XML
      </button>
      <button
        class="xml-btn"
        id="sealPlaceBtn"
        style="display: none"
        onclick="window.startSealPlacementWithMock()"
      >
        放置印章
      </button>
      <button
        class="print-btn"
        id="printBtn"
        style="display: none"
        onclick="window.printOFD()"
      >
        🖨️ 打印
      </button>
      <div class="zoom-controls" id="zoomControls" style="display: none">
        <button
          class="zoom-btn"
          onclick="window.zoomOut()"
          title="缩小 (Ctrl+-)"
        >
          −
        </button>
        <span class="zoom-level" id="zoomLevel">100%</span>
        <button
          class="zoom-btn"
          onclick="window.zoomIn()"
          title="放大 (Ctrl++)"
        >
          +
        </button>
        <button
          class="zoom-btn zoom-reset"
          onclick="window.resetZoom()"
          title="重置缩放"
        >
          ↺
        </button>
      </div>
      <span class="status" id="status">⏳ 加载 WASM...</span>
    </div>

    <!-- XML 查看弹窗 -->
    <div class="modal-overlay" id="xmlModal">
      <div class="modal">
        <div class="modal-header">
          <h3>📦 OFD 压缩包内容</h3>
          <button class="modal-close" onclick="window.hideXmlModal()">
            关闭
          </button>
        </div>
        <div class="modal-body">
          <div class="modal-sidebar" id="xmlFileList"></div>
          <div class="modal-content">
            <div class="modal-content-header" id="xmlFileName">
              ← 点击左侧文件查看内容
            </div>
            <pre class="xml-content" id="xmlContent"></pre>
          </div>
        </div>
      </div>
    </div>
    <div class="main-container">
      <div class="sidebar">
        <h3>📋 文档信息</h3>
        <div id="docInfo">
          <div class="info-item">
            <span class="info-label">状态</span
            ><span class="info-value">未加载</span>
          </div>
        </div>
        <h3 style="margin-top: 20px">📑 页面列表</h3>
        <div class="page-list" id="pageList"></div>
      </div>
      <div class="viewer" id="viewer">
        <div class="empty-state">
          <p style="font-size: 48px">📄</p>
          <p>请选择 OFD 文件</p>
          <p style="font-size: 12px; color: #555">支持拖拽文件到页面</p>
        </div>
      </div>
    </div>
    <script type="module" src="index.js"></script>
  </body>
</html>
